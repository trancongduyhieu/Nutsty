name: Build Nutsty Windows Portable (.exe)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements_win.txt'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_win.txt
          pip install pyinstaller

      - name: Download Standalone Windows Binaries (yt-dlp and mpv)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Write-Host "Downloading yt-dlp.exe..."
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin\yt-dlp.exe"
          
          Write-Host "Downloading standalone mpv.exe..."
          $mpvUrl = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260921/mpv-x86_64-20260921-git-e76a35ec95.7z"
          try {
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
            $asset = $rel.assets | Where-Object { $_.name -match '^mpv-x86_64-\d+.*\.7z$' } | Select-Object -First 1
            if ($asset -and $asset.browser_download_url) {
              $mpvUrl = $asset.browser_download_url
            }
          } catch {
            Write-Host "Could not query GitHub API for mpv, falling back to static release URL: $mpvUrl"
          }
          Write-Host "Downloading MPV from $mpvUrl..."
          Invoke-WebRequest -Uri $mpvUrl -OutFile "mpv.7z"
          Write-Host "Extracting mpv.exe..."
          7z e mpv.7z -o"bin\" mpv.exe d3dcompiler_43.dll -r -y
          if (Test-Path "bin\mpv.com") { Remove-Item "bin\mpv.com" -Force }
          Remove-Item "mpv.7z" -Force
          Write-Host "Bin directory contents:"
          Get-ChildItem -Path bin

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --clean nutsty.spec

      - name: Prepare Distribution Folder
        shell: pwsh
        run: |
          if (Test-Path "start.bat") { Copy-Item "start.bat" -Destination "dist\Nutsty\" }
          if (Test-Path "Nutsty_SafeMode_OpenGL.bat") { Copy-Item "Nutsty_SafeMode_OpenGL.bat" -Destination "dist\Nutsty\" }
          if (Test-Path "run_debug.bat") { Copy-Item "run_debug.bat" -Destination "dist\Nutsty\" }
          if (Test-Path "bin") {
            New-Item -ItemType Directory -Force -Path "dist\Nutsty\bin"
            Copy-Item -Path "bin\*" -Destination "dist\Nutsty\bin\" -Recurse -Force
          }
          Copy-Item "shell.qml" -Destination "dist\Nutsty\" -Force
          Copy-Item "compat" -Destination "dist\Nutsty\" -Recurse -Force
          Copy-Item "components" -Destination "dist\Nutsty\" -Recurse -Force
          Copy-Item "backend" -Destination "dist\Nutsty\" -Recurse -Force
          Copy-Item "assets" -Destination "dist\Nutsty\" -Recurse -Force

      - name: Archive Distribution Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Nutsty\*" -DestinationPath "Nutsty_Windows_Portable.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nutsty_Windows_Portable
          path: Nutsty_Windows_Portable.zip
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Nutsty_Windows_Portable.zip
          name: "Nutsty ${{ github.ref_name }}"
          body: |
            ### 🚀 Dành cho người dùng Windows (Tải về và nghe ngay)
            - **Bước 1:** Bấm tải file **`Nutsty_Windows_Portable.zip`** ở mục **Assets** bên dưới.
            - **Bước 2:** Giải nén file zip ra thư mục bất kỳ.
            - **Bước 3:** Bấm đúp chuột vào file **`start.bat`** (hoặc `Nutsty.exe`) để mở ứng dụng và nghe nhạc ngay lập tức.
            *(Bản Portable đã tích hợp sẵn toàn bộ runtime, mpv và yt-dlp, không cần cài đặt Python hay thao tác dòng lệnh).*

            ---
            ### ✨ Có gì mới trong bản ${{ github.ref_name }}?
            - **Phiên âm lời bài hát Latinh (Romanization)**: Hỗ trợ tự động Romaji (Nhật), Romaja (Hàn), Pinyin (Trung) đồng bộ từng câu cho nhạc Anime, K-Pop, C-Pop.
            - **Kính lỏng PlayerBar Deep Obsidian**: Bổ sung lớp đế sẫm màu chống lem chữ khi cuộn danh sách bài hát; hiệu ứng khúc xạ quang học tinh tế.
            - **Hợp nhất Bề mặt Bìa MediaCoverSurface**: Tự động bo tròn 16px video canvas Apple Music / Spotify không lem 4 góc, khắc phục triệt để lỗi không load ảnh bìa Retina.
            - **Bộ đếm Hẹn giờ ngủ Deep Module**: SleepTimerController với đường cong hạ âm lượng Cosine Fade êm dịu 5s trước khi dừng.
            - **Giao diện Điểm mới (What's New Modal)**: Tích hợp cửa sổ chào mừng và giới thiệu tính năng mới ngay trong ứng dụng và phần Cài đặt.
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
