[package]
name = "nutsty-tray"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
async-io = "2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
