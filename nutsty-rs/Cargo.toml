[workspace]
members = [
    "crates/nutsty-core",
    "crates/nutsty-lyrics",
    "crates/nutsty-audio",
    "crates/nutsty-library",
    "crates/nutsty-ui",
    "crates/nutsty-bridge",
    "crates/nutsty-daemon",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Nutsty Team"]
license = "MIT"

[workspace.dependencies]
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
crossbeam-channel = "0.5"
lofty = "0.25"
walkdir = "2"
dirs = "6"
rayon = "1.12"
md-5 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
gpui = { package = "gpui-ce", version = "0.3" }
gpui_platform = { package = "gpui_ce_platform", version = "0.3" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
