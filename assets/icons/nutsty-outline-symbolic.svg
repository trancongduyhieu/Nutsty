    <rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    <rect x="9.6" y="11.5" width="3" height="9" rx="1.5" fill="#ffffff"/>
    <rect x="14.5" y="8" width="3" height="16" rx="1.5" fill="#ffffff"/>
    <rect x="19.4" y="11.5" width="3" height="9" rx="1.5" fill="#ffffff"/>
</svg>
